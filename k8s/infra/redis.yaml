# Demo-grade in-cluster Redis. For production use Amazon ElastiCache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: order-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
